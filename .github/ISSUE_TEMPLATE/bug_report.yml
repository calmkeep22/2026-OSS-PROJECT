name: 버그 제보
description: 재현 가능한 오류나 접근성 문제를 알려주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 제보 전에 기존 이슈에 같은 문제가 등록되어 있는지 확인해 주세요. API 키, 토큰, 계좌번호 등 민감정보는 작성하지 마세요.

  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 명확히 작성해 주세요.
      placeholder: 기대한 동작과 실제 동작을 함께 적어주세요.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 문제를 다시 발생시킬 수 있는 순서를 작성해 주세요.
      placeholder: |
        1. 프로그램을 실행합니다.
        2. ... 화면으로 이동합니다.
        3. ... 키를 누릅니다.
        4. 오류가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상이라면 어떻게 동작해야 하는지 작성해 주세요.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - JavaFX 데스크톱 앱
        - 키보드 탐색
        - 스크린리더
        - TTS
        - Sonification
        - 백엔드/API 연동
        - AI 분석 연동
        - 빌드/설치
        - 문서
        - 기타
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 프로그램 버전 또는 커밋
      placeholder: 예) v0.1.0 또는 abc1234

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: Windows, Java 버전과 사용한 보조기술을 작성해 주세요.
      placeholder: 예) Windows 11, Java 21, NVDA 2026.1

  - type: textarea
    id: evidence
    attributes:
      label: 로그 및 참고 자료
      description: 민감정보를 제거한 로그, 화면 캡처 등을 첨부해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 민감정보를 제거했습니다.
          required: true
        - label: 기존 이슈에서 같은 문제를 검색했습니다.
          required: true

