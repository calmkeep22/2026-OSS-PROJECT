name: 기능 제안
description: 새로운 기능이나 접근성 개선 아이디어를 제안해 주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: 해결하려는 문제
      description: 어떤 사용자가 어떤 상황에서 불편을 겪는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 동작을 구체적으로 작성해 주세요.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - JavaFX 데스크톱 앱
        - 키보드 탐색
        - 스크린리더
        - TTS
        - Sonification
        - 백엔드/API 연동
        - AI 분석 연동
        - 빌드/설치
        - 문서
        - 기타
    validations:
      required: true

  - type: textarea
    id: accessibility
    attributes:
      label: 접근성 영향
      description: 저시력자 또는 시각장애인에게 어떤 도움이 되는지 작성해 주세요.

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 해결 방법이 있었다면 작성해 주세요.

  - type: checkboxes
    id: scope
    attributes:
      label: 프로젝트 원칙 확인
      options:
        - label: 이 제안은 자동매매나 직접적인 매수·매도 추천을 요구하지 않습니다.
          required: true
        - label: 기존 이슈에서 비슷한 제안을 검색했습니다.
          required: true

